[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cubeshift"
version = "0.1.0"
description = "Artificially redshift IFU data cubes and re-observe them with another instrument"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Bronwyn Reichardt Chu" },
    { name = "Janevra Pier" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "astropy>=6.0",
    "mpdaf>=3.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
plot = ["matplotlib-scalebar", "reproject"]
mosaic = ["montage-wrapper"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning", "ignore::astropy.wcs.FITSFixedWarning"]
markers = ["slow: runs the full pipeline chain (seconds)"]
